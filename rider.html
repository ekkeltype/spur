<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch &amp; Spur: Rider view harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Rye&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #efe6d2;
        font: 12px/1.45 'Alegreya Sans', system-ui, sans-serif;
      }
      #view {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #panel {
        position: absolute;
        right: 8px;
        bottom: 8px;
        max-width: 420px;
        padding: 6px 9px;
        border-radius: 6px;
        background: rgba(20, 16, 13, 0.82);
        border: 1px solid #5e5246;
      }
      #panel b {
        color: #c8a15a;
      }
      #scenes {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin: 4px 0;
      }
      #scenes button {
        font: 11px 'Alegreya Sans', system-ui, sans-serif;
        background: #2a2118;
        color: #efe6d2;
        border: 1px solid #5e5246;
        border-radius: 4px;
        padding: 1px 6px;
        cursor: pointer;
      }
      #scenes button.on {
        background: #c8a15a;
        color: #2a2118;
      }
      #info {
        white-space: pre-wrap;
      }
      body.nohud #panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <div id="scenes"></div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/dev/rider-harness.ts"></script>
  </body>
</html>
