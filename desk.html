<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spur: the Engineer's desk (dev bench)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Rye&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0907;
        color: #efe6d2;
        font: 14px/1.35 'Alegreya Sans', system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      /* The bench drawer: dev controls over the desk, hidden with ` (backquote) or ?ui=0. */
      #bench {
        position: fixed;
        right: 10px;
        top: 70px;
        z-index: 50;
        width: 250px;
        max-height: calc(100% - 90px);
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(18, 15, 12, 0.94);
        border: 1px solid rgba(200, 161, 90, 0.5);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        font-size: 12.5px;
      }
      #bench h3 {
        margin: 8px 0 4px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8a15a;
      }
      #bench h3:first-child {
        margin-top: 0;
      }
      #bench .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #bench button,
      #bench select {
        font: inherit;
        color: #efe6d2;
        background: #2a2119;
        border: 1px solid rgba(200, 161, 90, 0.4);
        border-radius: 4px;
        padding: 2px 7px;
        cursor: pointer;
      }
      #bench button[aria-pressed='true'] {
        background: #c8a15a;
        color: #2a2118;
      }
      #bench .stats {
        margin-top: 6px;
        color: rgba(239, 230, 210, 0.6);
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      body.noui #bench {
        display: none;
      }
      #paused {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.45);
        font: 44px/1 Rye, serif;
        color: #efe6d2;
        letter-spacing: 0.1em;
        pointer-events: none;
      }
      #paused[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="paused" hidden>PAUSED <span style="font: 16px 'Alegreya Sans'; letter-spacing: 0">Esc to resume (the bench stands in for the app's pause screen)</span></div>
    <div id="bench"></div>
    <script type="module" src="/src/dev/desk-harness.ts"></script>
  </body>
</html>
